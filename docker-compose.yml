services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mantaps
      POSTGRES_USER: mantaps
      POSTGRES_PASSWORD: mantaps
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://mantaps:mantaps@db:5432/mantaps
    ports:
      - "8000:8000"
volumes:
  pgdata:
